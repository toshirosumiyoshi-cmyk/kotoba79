<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ことばのひろば｜79緑 仮装のひろば</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 仮装のひろば</a>
  <header>
    <h1>ことばのひろば</h1>
  </header>
  <p class="lead">仮装のテーマを考えるうえで、思いついた言葉・最近気になっている言葉、なんでもいいので書いていってください！1つずつ書いてくれれば、何回でも送れます！</p>

  <form class="card" id="f" autocomplete="off">
    <div class="field">
      <label for="word">ことば</label>
      <div class="row">
        <input type="text" id="word" maxlength="40">
        <button class="send" id="send" type="submit">置く</button>
      </div>
    </div>

    <p class="hint divider">ここから下は、くわしく書きたいときだけ（なくてもOK）</p>

    <div class="field">
      <label for="note">そのことばについて <span class="hint">なぜ思いついたか、どんなイメージか</span></label>
      <textarea id="note" maxlength="300"></textarea>
    </div>
    <div class="field">
      <span class="label" id="areaLabel">舞台の地域 <span class="hint">近いものを1つ</span></span>
      <div class="chips" id="area" role="group" aria-labelledby="areaLabel"></div>
    </div>
    <div class="field">
      <span class="label" id="kindLabel">題材の種類 <span class="hint">近いものを1つ</span></span>
      <div class="chips" id="kind" role="group" aria-labelledby="kindLabel"></div>
      <p class="hint">歴史＝実際の出来事や時代／伝承・物語＝神話・伝説・昔話・映画など／文化・祭＝祭りや行事そのもの／オリジナル＝独自の物語や抽象的なもの</p>
    </div>
    <input type="text" id="hp" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px" autocomplete="off">
    <p class="toast" id="toast" role="status"></p>
  </form>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="seahead">
      <h2>ことばの海 <span class="hint" id="count"></span></h2>
      <button class="toggle" id="view" type="button">一覧で見る</button>
    </div>
    <p class="hint">みんなはどんな言葉を考えたのかな？　さわると止まります。</p>
    <div class="sea" id="sea"><p class="empty">読み込み中…</p></div>
  </section>
</main>

<script src="config.js?v=3"></script>
<script src="common.js?v=3"></script>
<script>
const H = window.Hiroba;
const $ = id => document.getElementById(id);
const area = H.chipGroup($('area'), ['日本', '中華', '西洋', 'その他の異国', '架空・抽象']);
const kind = H.chipGroup($('kind'), ['歴史', '伝承・物語', '文化・祭', 'オリジナル']);
const mine = new Set();
let words = [], seen = null, sig = '', listMode = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const word = $('word').value.trim();
  if (!word) { H.toast($('toast'), '何か書いてから置いてください。', true); return; }
  $('send').disabled = true;
  try {
    await H.post({ type: 'word', word, note: $('note').value, area: area.value(), kind: kind.value(), hp: $('hp').value });
    mine.add(word);
    $('word').value = ''; $('note').value = ''; area.reset(); kind.reset();
    H.toast($('toast'), '「' + word + '」を送りました！ほかにもあれば続けてどうぞ！');
    loadWords();
    $('word').focus();
  } catch (e) {
    H.toast($('toast'), H.errorText(e), true);
  } finally {
    $('send').disabled = false;
  }
});

$('view').addEventListener('click', () => { listMode = !listMode; render(true); });
$('sea').addEventListener('click', () => $('sea').classList.toggle('paused'));

// ことば1つぶんの泡。たくさん出たことばほど少し大きく
function bubble(item, fresh) {
  const s = document.createElement('span');
  s.className = 'w' + (mine.has(item.w) ? ' mine' : '') + (fresh ? ' fresh' : '');
  s.style.fontSize = (1 + Math.min(item.n - 1, 4) * 0.12) + 'rem';
  s.textContent = item.w;
  if (item.n > 1) { const c = document.createElement('small'); c.textContent = '×' + item.n; s.appendChild(c); }
  return s;
}

function render(force) {
  const sea = $('sea');
  const newSig = (listMode ? 'L' : 'S') + JSON.stringify(words) + [...mine].join();
  if (!force && newSig === sig) return;
  sig = newSig;
  $('view').textContent = listMode ? '海で見る' : '一覧で見る';
  sea.textContent = '';
  if (!words.length) {
    sea.innerHTML = '<p class="empty">まだありません。最初のひとつをどうぞ。</p>';
    return;
  }
  const isFresh = item => seen && !seen.has(item.w);

  // 一覧（ことばが少ないとき・動きを減らす設定のとき）
  if (listMode || words.length < 8) {
    const box = document.createElement('div');
    box.className = listMode ? 'list' : 'list-sea';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;padding-inline:18px';
    words.forEach(it => box.appendChild(bubble(it, isFresh(it))));
    sea.style.background = listMode ? 'var(--surface)' : '';
    sea.style.border = listMode ? '2px solid var(--line)' : '';
    sea.appendChild(box);
    if (listMode) box.className = 'list';
    return;
  }
  sea.style.background = ''; sea.style.border = '';

  // 海：ことばを何本かの流れに分けて、左右交互に流す
  const laneCount = Math.max(2, Math.min(8, Math.ceil(words.length / 7)));
  const lanes = Array.from({ length: laneCount }, () => []);
  words.forEach((it, i) => lanes[i % laneCount].push(it));
  const width = sea.clientWidth || 360;

  lanes.forEach((items, li) => {
    const lane = document.createElement('div');
    lane.className = 'lane' + (li % 2 ? ' rev' : '');
    lane.style.display = 'flex'; lane.style.width = 'max-content'; // 見た目の読み込みが遅れても横1列にする
    sea.appendChild(lane);
    // 1周ぶん：画面幅より長くなるまで並べる（くり返しは最大4回）
    let guard = 0;
    do { items.forEach(it => lane.appendChild(bubble(it, isFresh(it)))); guard++; }
    while (lane.scrollWidth < width + 40 && guard < 4);
    // 同じものをもう1周ぶん並べて、切れ目なくつなぐ
    const half = [...lane.children];
    half.forEach(n => { const c = n.cloneNode(true); c.setAttribute('aria-hidden', 'true'); lane.appendChild(c); });
    const speed = 22 + (li % 3) * 7; // 1秒に進む量（px）
    lane.style.setProperty('--dur', Math.max(12, (lane.scrollWidth / 2) / speed) + 's');
  });
}

async function loadWords() {
  try {
    const d = await H.get('words');
    words = d.words || [];
    $('count').textContent = words.length ? (d.total + '個') : '';
    render(false);
    seen = new Set(words.map(w => w.w));
  } catch (e) {
    if (!words.length) $('sea').innerHTML = '<p class="empty">ことばの海を読み込めませんでした。少しあとで開き直してください。</p>';
  }
}
loadWords();
setInterval(() => { if (!document.hidden) loadWords(); }, 30000);
</script>
</body>
</html>
